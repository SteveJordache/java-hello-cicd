name: Java CI Pipeline

on:
  push:
    branches:
      - main
      - feature/**

  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: stevejordache/java-hello-cicd

jobs:

  build-test-package:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Maven tests
        run: mvn clean test

      - name: Package application
        run: mvn clean package

      - name: Build Docker image
        run: docker build -t java-hello-cicd:ci .

  docker-push:

    runs-on: ubuntu-latest

    needs: build-test-package

    if: github.ref == 'refs/heads/main'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Package application
        run: mvn clean package

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:${{ github.sha }} .

      - name: Push Docker latest tag
        run: docker push $IMAGE_NAME:latest

      - name: Push Docker SHA tag
        run: docker push $IMAGE_NAME:${{ github.sha }}

  deploy-qa:

    runs-on: ubuntu-latest

    needs: docker-push

    if: github.ref == 'refs/heads/main'

    steps:

      - name: Deploy application to QA EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_HOST }}
          username: ${{ secrets.QA_USER }}
          key: ${{ secrets.QA_SSH_KEY }}

          script: |

            docker pull stevejordache/java-hello-cicd:latest

            docker stop java-app || true

            docker rm java-app || true

            docker run -d \
              --name java-app \
              -p 8080:8080 \
              stevejordache/java-hello-cicd:latest

            sleep 10

            curl http://localhost:8080/health
